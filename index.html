<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Teaching Tool</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #14171c;
      --panel-2: #1b1f26;
      --border: #2a3038;
      --text: #eceef1;
      --muted: #8b919a;
      --accent: #4f8cff;
      --green: #3ddc84;
      --orange: #ff9f43;
      --blue: #6ea8ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: #101318;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .stage-badge {
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--green);
      text-transform: uppercase;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 20px 20px;
      min-height: 0;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .controls button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .controls button.active { background: var(--green); color: #0b0d10; border-color: var(--green); font-weight: 600; }
    #runBtn { background: var(--orange); color: #0b0d10; border-color: var(--orange); font-weight: 600; }
    .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .controls input[type=range] { width: 110px; }
    #prompt {
      flex: 1;
      min-width: 180px;
      background: #0e1116;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
      min-height: 0;
    }
    .stage, .inspector {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    #output {
      flex: 1;
      background: #0e1116;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 18px;
      line-height: 1.7;
      overflow: auto;
    }
    .token {
      display: inline-block;
      background: #232a36;
      border-radius: 4px;
      padding: 0 4px;
      margin: 0 1px 2px;
    }
    .placeholder { color: var(--muted); }
    .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--green);
      margin-left: 2px;
      vertical-align: -2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .inspector-split { display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1; }
    #context { overflow: auto; flex: 1; }
    .context-block {
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 13px;
      background: var(--panel-2);
    }
    .context-block .role {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .ctx-system { border-left: 3px solid var(--blue); }
    .ctx-system .role { color: var(--blue); }
    .ctx-user { border-left: 3px solid var(--orange); }
    .ctx-user .role { color: var(--orange); }
    .ctx-model { border-left: 3px solid var(--green); }
    .ctx-model .role { color: var(--green); }
    .ctx-tool { border-left: 3px solid #c9a227; }
    .ctx-tool .role { color: #c9a227; }
    .bars { display: flex; flex-direction: column; gap: 6px; }
    .bar-row {
      display: grid;
      grid-template-columns: 28px 1fr 36px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .bar-label { color: var(--text); }
    .bar-track { height: 8px; background: #0e1116; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--green); border-radius: 4px; }
    .bar-fill.top { background: var(--accent); }
    .bar-pct { color: var(--muted); text-align: right; }
    #status { font-size: 12px; color: var(--muted); margin-top: 10px; }
    footer { text-align: center; color: var(--muted); font-size: 11px; padding: 8px 12px 14px; }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>LLM Teaching Tool</h1>
    <span class="stage-badge" id="stageBadge">Stage: Bare</span>
  </header>
  <main>
    <div class="controls">
      <button class="active" data-stage="bare">Bare</button>
      <button data-stage="loop">Loop</button>
      <button data-stage="tools">Tools</button>
      <button data-stage="memory">Memory</button>
      <label>Temp <input type="range" id="temp" min="5" max="150" value="70" /> <span id="tempVal">0.70</span></label>
      <input id="prompt" value="What is the capital of France?" />
      <button id="stepBtn">Step</button>
      <button id="runBtn">Run</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="grid">
      <section class="stage">
        <h2>Output</h2>
        <div id="output"></div>
      </section>
      <section class="inspector">
        <h2>Inspector</h2>
        <div class="inspector-split">
          <div>
            <h2>Context window</h2>
            <div id="context"></div>
          </div>
          <div>
            <h2>Top candidate tokens</h2>
            <div class="bars" id="bars"></div>
          </div>
        </div>
        <div id="status">Idle</div>
      </section>
    </div>
  </main>
  <footer>Open this file in a browser. Step emits one token. Run plays the script. Temperature reshapes the bars.</footer>
  <script src="model.js"></script>
  <script src="harness.js"></script>
  <script src="app.js"></script>
</body>
</html>
